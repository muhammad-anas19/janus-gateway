version: "3.8"

services:
  janus-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_IP: "5.78.103.238"
    image: arcsip-janus-gateway:latest
    container_name: janus-gateway
    restart: unless-stopped

    # ------------------------------------------------------------------------
    # HOST NETWORKING — a media server should not sit behind docker-proxy.
    # Publishing tens of thousands of UDP ports through the userland proxy is
    # extremely heavy; host networking binds Janus directly to the host NIC and
    # removes per-packet NAT overhead, so the large RTP ranges below are usable.
    #
    # Consequences to handle in the host firewall (Hetzner):
    #   * 8188/tcp (WebSocket) is now bound on the host's PUBLIC IP in plaintext.
    #     Traefik terminates TLS in front of it, so BLOCK 8188 from the public
    #     internet and allow it only from the Traefik/host loopback.
    #   * 5060/udp+tcp (SIP) — restrict to the PortaOne/PortaSIP source IPs.
    #   * 10000-19998/udp (SIP-side RTP) and 20000-20200/udp (WebRTC RTP) — OPEN.
    #     The WebRTC range is the one in janus.jcfg (`media.rtp_port_range`) and
    #     THE WHOLE of it must be open: a partially-open range makes ICE succeed
    #     for some calls and fail for others. Read that file's comment before
    #     changing either number here — conferencing spends this range faster
    #     than plain calls do (2P + 1 peer connections for a P-party conference).
    # Media ranges are kept below 32768 to avoid colliding with the kernel
    # ephemeral range. If you ever widen them past 32768, also shrink
    # net.ipv4.ip_local_port_range on the host accordingly.
    #
    # NOTE: with host networking, `ports:` is ignored and removed. Traefik must
    # be able to reach 8188 on the host (via the docker bridge gateway / host
    # IP). VERIFY WSS routing immediately after switching — if signalling
    # breaks, the WS path, not the media path, is the thing to fix.
    # ------------------------------------------------------------------------
    network_mode: host

    # Traefik (TLS termination + WSS) — unchanged. See note above re: host net.
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.janus-gateway.rule=Host(`janus-gateway.coolify.arcsip.io`)"
        - "traefik.http.routers.janus-gateway.entrypoints=https"
        - "traefik.http.routers.janus-gateway.tls=true"
        - "traefik.http.routers.janus-gateway.tls.certresolver=letsencrypt"
        - "traefik.http.services.janus-gateway.loadbalancer.server.port=8188"
        - "traefik.http.routers.janus-gateway-http.rule=Host(`janus-gateway.coolify.arcsip.io`)"
        - "traefik.http.routers.janus-gateway-http.entrypoints=http"
        - "traefik.http.routers.janus-gateway-http.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

    environment:
      # Consumed by docker-entrypoint.sh:
      - NAT_PUBLIC_IP=5.78.103.238
      - JANUS_DEBUG_LEVEL=4
      # Pin the event-loop thread count; if unset the entrypoint uses nproc.
      # - JANUS_EVENT_LOOPS=8

    # High concurrent-call counts need a very high open-file-descriptor limit
    # (each call = several sockets/fds). The host kernel fs.file-max must also
    # be large enough (see sysctl notes in the handoff).
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    # Liveness: confirm the WebSocket port is accepting connections.
    # (Uses bash /dev/tcp; verify it reports healthy on first deploy and adjust
    # the probe if the base image lacks bash.)
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8188' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    # Optional: certs only needed if terminating WSS in Janus instead of Traefik.
    volumes:
      - ./certs:/opt/janus/share/janus/certs:ro
